<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}CampusConnect{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
      :root {
        --campus-pink: #c2185b;
        --campus-pink-dark: #921044;
        --campus-pink-light: #fff5f8;
        --campus-pink-border: #f2b8cf;
      }

      body.bg-light {
        background-color: var(--campus-pink-light) !important;
      }

      .navbar.bg-primary {
        background-color: var(--campus-pink) !important;
      }

      h1,
      h2,
      h3 {
        color: var(--campus-pink);
      }

      a {
        color: var(--campus-pink);
      }

      a:hover {
        color: var(--campus-pink-dark);
      }

      .btn-primary {
        --bs-btn-bg: var(--campus-pink);
        --bs-btn-border-color: var(--campus-pink);
        --bs-btn-hover-bg: var(--campus-pink-dark);
        --bs-btn-hover-border-color: var(--campus-pink-dark);
        --bs-btn-active-bg: var(--campus-pink-dark);
        --bs-btn-active-border-color: var(--campus-pink-dark);
      }

      .btn-outline-primary,
      .btn-outline-secondary {
        --bs-btn-color: var(--campus-pink);
        --bs-btn-border-color: var(--campus-pink);
        --bs-btn-hover-bg: var(--campus-pink);
        --bs-btn-hover-border-color: var(--campus-pink);
        --bs-btn-active-bg: var(--campus-pink-dark);
        --bs-btn-active-border-color: var(--campus-pink-dark);
      }

      .text-danger {
        color: var(--campus-pink) !important;
      }

      .alert-success,
      .alert-info,
      .alert-warning,
      .alert-danger {
        color: var(--campus-pink-dark);
        background-color: var(--campus-pink-light);
        border-color: var(--campus-pink-border);
      }

      .form-control:focus,
      .form-select:focus,
      .form-check-input:focus {
        border-color: var(--campus-pink-border);
        box-shadow: 0 0 0 0.25rem rgb(194 24 91 / 25%);
      }

      .form-check-input:checked {
        background-color: var(--campus-pink);
        border-color: var(--campus-pink);
      }
    </style>
  </head>
  <body class="bg-light">
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
      <div class="container">
        <a class="navbar-brand fw-semibold" href="{% url 'dashboard' %}">CampusConnect</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#main-navigation" aria-controls="main-navigation" aria-expanded="false" aria-label="Toggle navigation">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="main-navigation">
          <div class="navbar-nav ms-auto align-items-lg-center gap-lg-2">
            {% if user.is_authenticated %}
            <span class="navbar-text text-white">Hi, {{ user.username }}!</span>
            <a class="nav-link" href="{% url 'profile' %}">My profile</a>
            <form method="post" action="{% url 'logout' %}" class="d-inline">
              {% csrf_token %}
              <button class="btn btn-outline-light btn-sm" type="submit">Log out</button>
            </form>
            {% else %}
            <a class="nav-link" href="{% url 'login' %}">Log in</a>
            <a class="btn btn-light btn-sm" href="{% url 'signup' %}">Sign up</a>
            {% endif %}
          </div>
        </div>
      </div>
    </nav>
    <main class="container py-4">
      {% if messages %}
      <div class="mb-3" aria-live="polite">
        {% for message in messages %}
        <div class="alert {% if message.tags == 'error' %}alert-danger{% else %}alert-{{ message.tags }}{% endif %} alert-dismissible fade show" role="alert">
          {{ message }}
          <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>
        {% endfor %}
      </div>
      {% endif %}
      {% block content %}{% endblock %}
    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
